name: Refresh dashboard after review update

on:
  push:
    branches:
      - main
    paths:
      - data/reviews/reviews.json
      - data/contributions/contribution-state.json
      - scripts/generate-dashboard.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-dashboard-after-review
  cancel-in-progress: false

jobs:
  refresh-dashboard:
    name: Regenerate radar dashboard
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Regenerate dashboard files
        run: python3 scripts/generate-dashboard.py

      - name: Detect dashboard changes
        id: changes
        run: |
          if git diff --quiet -- docs/radar/index.html docs/radar/admin-data.json docs/radar/contributions/index.html docs/radar/contribution-state.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit refreshed dashboard
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "jamesbregenzer"
          git config user.email "jamesbregenzer@users.noreply.github.com"
          git add docs/radar/index.html docs/radar/admin-data.json docs/radar/contributions/index.html docs/radar/contribution-state.json
          git commit -m "Refresh dashboard after review update"
          git pull --rebase origin main
          git push origin main
