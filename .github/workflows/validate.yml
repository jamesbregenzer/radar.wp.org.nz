name: Validate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Prove deterministic fixture certification and offline verification
        run: python3 -m unittest tests.test_certification -v
      - name: Prove stable operation and fail-closed pipeline contracts
        run: python3 -m unittest tests.test_operations -v
      - name: Prove certified feed and UI alignment contracts
        run: python3 -m unittest tests.test_wp5 -v
      - name: Prove Worker API projection and integrity behavior
        run: node --test tests/test-worker.mjs
      - name: Prove WP-6 migration configuration and portability
        run: python3 -m unittest tests.test_wp6 -v
      - name: Prove Worker Static Assets bundle builds without deployment
        run: npx wrangler deploy --dry-run --outdir "$RUNNER_TEMP/radar-worker-dry-run"
      - name: Prove committed data can regenerate outputs deterministically
        run: python3 scripts/run-radar.py --skip-fetch --reference-time 2026-01-15T12:00:00Z
